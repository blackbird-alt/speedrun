<!DOCTYPE html>
<!--

  License: GNU AGPL, version 3 or later; http://www.gnu.org/licenses/agpl.html

  Speedrun FE fork: an on-screen scientific calculator for practicing under
  real FE exam conditions. Its function set is modelled on the NCEES-approved
  TI-30XS MultiView (the model NCEES itself supplies on-screen), so students
  practise only with functionality they are actually allowed on exam day:
  basic arithmetic, powers/roots, trig (DEG/RAD), logs, factorial, scientific
  notation, one memory register. No graphing, no CAS, no programmability.

  Self-contained (no external assets), so it can be hosted in a Qt WebEngine
  dialog on desktop or an Android WebView on the phone from the same file.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>FE Calculator</title>
<style>
  :root{
    --bg:#0b1220; --panel:#141f36; --panel2:#0f1830; --line:#26344f;
    --text:#eaf1fc; --muted:#93a2bd; --copper:#E0A45C;
    --key:#182541; --key-hi:#1f2f52; --op:#243759;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:var(--bg);
    font-family:system-ui,"Segoe UI",Roboto,-apple-system,sans-serif;color:var(--text);}
  .calc{max-width:420px;margin:0 auto;height:100%;display:flex;flex-direction:column;
    padding:12px;gap:10px;}
  .head{display:flex;align-items:center;justify-content:space-between;padding:2px 4px;}
  .title{font:600 11px/1 ui-monospace,Consolas,monospace;letter-spacing:.18em;
    text-transform:uppercase;color:var(--copper);}
  .badges{display:flex;gap:6px;align-items:center;}
  .badge{font:600 10px/1 ui-monospace,monospace;letter-spacing:.08em;color:var(--muted);
    border:1px solid var(--line);border-radius:999px;padding:5px 9px;}
  .badge.on{color:#2a1b08;background:var(--copper);border-color:var(--copper);}
  /* DISPLAY */
  .display{background:var(--panel2);border:1px solid var(--line);border-radius:14px;
    padding:14px 16px;text-align:right;overflow:hidden;position:relative;}
  .display::before{content:"";position:absolute;top:0;left:0;width:40px;height:3px;
    background:var(--copper);border-bottom-right-radius:3px;}
  .expr{font:500 16px/1.3 ui-monospace,Consolas,monospace;color:var(--muted);
    min-height:22px;word-break:break-all;white-space:pre-wrap;}
  .result{font:700 34px/1.15 ui-monospace,Consolas,monospace;color:var(--text);
    min-height:40px;word-break:break-all;}
  .result.err{color:#f2849e;font-size:20px;}
  /* KEYS */
  .grid{flex:1;display:grid;grid-template-columns:repeat(6,1fr);gap:8px;min-height:0;}
  button.k{border:1px solid var(--line);border-radius:12px;background:var(--key);
    color:var(--text);font:600 17px/1 system-ui;cursor:pointer;user-select:none;
    display:flex;align-items:center;justify-content:center;padding:0;
    transition:background .1s ease,transform .05s ease,border-color .1s ease;min-height:44px;}
  button.k:active{transform:translateY(1px);background:var(--key-hi);}
  .k.fn{background:var(--panel);color:var(--muted);font-size:14px;font-family:ui-monospace,monospace;}
  .k.op{background:var(--op);color:#cfe0ff;}
  .k.eq{background:linear-gradient(180deg,#ecb877,var(--copper));color:#2a1b08;font-weight:700;}
  .k.acc{color:var(--copper);}
  .k.sup{font-size:12px;}
  .k.wide{grid-column:span 2;}
  .k .sub{font-size:10px;color:var(--muted);}
  .k.second-on{outline:2px solid var(--copper);}
</style>
</head>
<body>
<div class="calc">
  <div class="head">
    <span class="title">FE Calculator</span>
    <div class="badges">
      <span class="badge" id="secBadge">2nd</span>
      <span class="badge on" id="angBadge">DEG</span>
    </div>
  </div>
  <div class="display">
    <div class="expr" id="expr">&nbsp;</div>
    <div class="result" id="result">0</div>
  </div>
  <div class="grid" id="grid"></div>
</div>
<script>
"use strict";
(function () {
  let expr = "";        // display expression (with pretty symbols)
  let last = "0";       // last computed result (Ans)
  let deg = true;       // angle mode
  let second = false;   // 2nd (shift) active
  let mem = 0;          // single memory register
  let justEvaluated = false;

  const exprEl = document.getElementById("expr");
  const resEl = document.getElementById("result");
  const secBadge = document.getElementById("secBadge");
  const angBadge = document.getElementById("angBadge");

  // Button model. Each: label, optional 2nd-label, css class, and action.
  // ins: text inserted into the expression. Special actions handled by name.
  const K = (label, opts = {}) => Object.assign({ label }, opts);
  const layout = [
    K("2nd", { cls: "fn acc", act: "second" }),
    K("DEG/RAD", { cls: "fn", act: "angle" }),
    K("x²", { cls: "fn", ins: "^2", second: "x³", insSecond: "^3" }),
    K("xʸ", { cls: "fn", ins: "^" , second: "ʸ√x", insSecond: "^(1/" }),
    K("√", { cls: "fn", ins: "√(", second: "∛", insSecond: "∛(" }),
    K("C", { cls: "fn acc", act: "clear" }),

    K("sin", { cls: "fn", ins: "sin(", second: "sin⁻¹", insSecond: "asin(" }),
    K("cos", { cls: "fn", ins: "cos(", second: "cos⁻¹", insSecond: "acos(" }),
    K("tan", { cls: "fn", ins: "tan(", second: "tan⁻¹", insSecond: "atan(" }),
    K("ln", { cls: "fn", ins: "ln(", second: "eˣ", insSecond: "exp(" }),
    K("log", { cls: "fn", ins: "log(", second: "10ˣ", insSecond: "10^(" }),
    K("DEL", { cls: "fn acc", act: "del" }),

    K("(", { cls: "fn", ins: "(" }),
    K(")", { cls: "fn", ins: ")" }),
    K("1/x", { cls: "fn", ins: "^(-1)" }),
    K("π", { cls: "fn", ins: "π" }),
    K("e", { cls: "fn", ins: "e" }),
    K("n!", { cls: "fn", ins: "!" }),

    K("7", { ins: "7" }), K("8", { ins: "8" }), K("9", { ins: "9" }),
    K("÷", { cls: "op", ins: "÷" }), K("EE", { cls: "fn", ins: "×10^" }),
    K("M+", { cls: "fn", act: "mplus" }),

    K("4", { ins: "4" }), K("5", { ins: "5" }), K("6", { ins: "6" }),
    K("×", { cls: "op", ins: "×" }), K("%", { cls: "fn", ins: "%" }),
    K("M−", { cls: "fn", act: "mminus" }),

    K("1", { ins: "1" }), K("2", { ins: "2" }), K("3", { ins: "3" }),
    K("−", { cls: "op", ins: "−" }), K("±", { cls: "fn", act: "negate" }),
    K("MR", { cls: "fn", act: "mr" }),

    K("0", { ins: "0" }), K(".", { ins: "." }), K("Ans", { cls: "fn", ins: "Ans" }),
    K("+", { cls: "op", ins: "+" }), K("=", { cls: "eq", act: "equals" }),
    K("MC", { cls: "fn", act: "mc" }),
  ];

  const grid = document.getElementById("grid");
  const buttons = [];
  layout.forEach((b) => {
    const el = document.createElement("button");
    el.className = "k " + (b.cls || "");
    el.dataset.i = buttons.length;
    render(el, b);
    el.addEventListener("click", () => press(b));
    grid.appendChild(el);
    buttons.push({ el, model: b });
  });

  function render(el, b) {
    const label = second && b.second ? b.second : b.label;
    el.innerHTML = label;
  }
  function refreshLabels() {
    buttons.forEach(({ el, model }) => render(el, model));
    secBadge.classList.toggle("on", second);
  }

  function factorial(n) {
    if (n < 0 || Math.floor(n) !== n) return NaN;
    let r = 1;
    for (let i = 2; i <= n; i++) r *= i;
    return r;
  }

  function evaluate(pretty) {
    // Convert the pretty display expression into evaluable JS, then run it in
    // a restricted scope (only the math helpers below are in scope).
    let js = pretty
      .replace(/Ans/g, "(" + last + ")")
      .replace(/×10\^/g, "*10**")
      .replace(/×/g, "*")
      .replace(/÷/g, "/")
      .replace(/−/g, "-")
      .replace(/√\(/g, "sqrt(")
      .replace(/∛\(/g, "cbrt(")
      .replace(/π/g, "(PI)")
      .replace(/\^/g, "**")
      .replace(/%/g, "/100");
    // factorial: number or parenthesised group followed by "!"
    for (let i = 0; i < 6; i++) {
      js = js.replace(/(\d+(?:\.\d+)?|\([^()]*\))!/g, "fact($1)");
    }
    const toRad = (x) => (deg ? (x * Math.PI) / 180 : x);
    const fromDeg = (x) => (deg ? (x * 180) / Math.PI : x);
    const scope = {
      sin: (x) => Math.sin(toRad(x)),
      cos: (x) => Math.cos(toRad(x)),
      tan: (x) => Math.tan(toRad(x)),
      asin: (x) => fromDeg(Math.asin(x)),
      acos: (x) => fromDeg(Math.acos(x)),
      atan: (x) => fromDeg(Math.atan(x)),
      ln: Math.log,
      log: Math.log10,
      exp: Math.exp,
      sqrt: Math.sqrt,
      cbrt: Math.cbrt,
      fact: factorial,
      PI: Math.PI,
      e: Math.E,
    };
    const names = Object.keys(scope);
    const vals = names.map((n) => scope[n]);
    // eslint-disable-next-line no-new-func
    const fn = new Function(...names, '"use strict"; return (' + js + ");");
    const out = fn(...vals);
    if (typeof out !== "number" || !isFinite(out)) throw new Error("bad");
    // Trim floating-point noise.
    return parseFloat(out.toPrecision(12)).toString();
  }

  function updateResultPreview() {
    if (!expr) { resEl.textContent = "0"; resEl.classList.remove("err"); return; }
    try {
      resEl.textContent = evaluate(expr);
      resEl.classList.remove("err");
    } catch (e) {
      // Keep the last good preview quietly while typing.
    }
  }

  function refresh() {
    exprEl.innerHTML = expr ? expr : "&nbsp;";
    updateResultPreview();
  }

  function press(b) {
    if (b.act) {
      handleAction(b.act);
      if (b.act !== "second") { second = false; refreshLabels(); }
      return;
    }
    // insertion button
    const text = second && b.insSecond ? b.insSecond : b.ins;
    if (justEvaluated && /[0-9.]/.test(text)) { expr = ""; }
    justEvaluated = false;
    expr += text;
    if (second) { second = false; refreshLabels(); }
    refresh();
  }

  function handleAction(act) {
    switch (act) {
      case "second": second = !second; refreshLabels(); return;
      case "angle": deg = !deg; angBadge.textContent = deg ? "DEG" : "RAD"; return;
      case "clear": expr = ""; resEl.classList.remove("err"); refresh(); return;
      case "del": expr = expr.slice(0, -1); refresh(); return;
      case "negate":
        if (expr === "" || justEvaluated) { expr = "−(" + last + ")"; justEvaluated = false; }
        else { expr = "−(" + expr + ")"; }
        refresh(); return;
      case "equals":
        try {
          last = evaluate(expr);
          resEl.textContent = last;
          resEl.classList.remove("err");
          exprEl.textContent = expr + " =";
          expr = last;
          justEvaluated = true;
        } catch (e) {
          resEl.textContent = "Error";
          resEl.classList.add("err");
        }
        return;
      case "mplus": try { mem += parseFloat(evaluate(expr || last)); flashMem(); } catch (e) {} return;
      case "mminus": try { mem -= parseFloat(evaluate(expr || last)); flashMem(); } catch (e) {} return;
      case "mr": if (justEvaluated) expr = ""; justEvaluated = false; expr += parseFloat(mem.toPrecision(12)).toString(); refresh(); return;
      case "mc": mem = 0; flashMem(); return;
    }
  }

  function flashMem() {
    const b = document.getElementById("angBadge");
    // brief copper flash on the display to acknowledge a memory op
    resEl.style.color = "var(--copper)";
    setTimeout(() => (resEl.style.color = ""), 150);
  }

  // Physical keyboard support (desktop).
  window.addEventListener("keydown", (ev) => {
    const k = ev.key;
    if (/[0-9.]/.test(k)) { press({ ins: k }); }
    else if (k === "+") press({ ins: "+", cls: "op" });
    else if (k === "-") press({ ins: "−" });
    else if (k === "*") press({ ins: "×" });
    else if (k === "/") press({ ins: "÷" });
    else if (k === "^") press({ ins: "^" });
    else if (k === "(" || k === ")") press({ ins: k });
    else if (k === "Enter" || k === "=") { ev.preventDefault(); handleAction("equals"); }
    else if (k === "Backspace") { ev.preventDefault(); handleAction("del"); }
    else if (k === "Escape") handleAction("clear");
    else return;
  });

  refresh();
})();
</script>
</body>
</html>
